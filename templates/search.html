<!DOCTYPE html>
<html>
<head>
    <title>Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand">Music Player</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home_page.home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('search_page.song_search') }}">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('playlist_list_page.user_playlists') }}">Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('liked_songs_page.liked_songs') }}">Liked Songs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('profile_page.profile') }}">Profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4">Search</h2> 

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('search_page.song_search') }}">
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Search for a song..." name="search_query" required>
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </form>

        {% if songs %}
            <table class="table">
                <thead>
                    <tr>
                        <th>Song Name</th>
                        <th>Album</th>
                        <th>Artist</th>
                        <th>Genre</th>
                        <th>Duration</th>
                        <th>   </th>
                    </tr>
                </thead>
                <tbody>
                    {% for song in songs %}
                    <tr>
                        <td>{{ song[0] }}</td>
                        <td>{{ song[1] }}</td>
                        <td>{{ song[2] }}</td>
                        <td>{{ song[3] }}</td>
                        <td>{{ song[4] }}</td>
                        <td>
                            <form method="post">
                                <input type="hidden" name="song_id" value="{{ song[0] }}">
                                <button type="submit" name="action" value="select_playlist" class="btn btn-outline-primary btn-sm">Add to Playlist</button>
                            </form>
                            
                        </td>
                        
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}
    </div>
    
</body>
</html>
